apiVersion: v1
kind: Namespace
metadata:
  name: dota2-checker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dota2-checker
  namespace: dota2-checker
  labels:
    app: dota2-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dota2-checker
  template:
    metadata:
      labels:
        app: dota2-checker
    spec:
      containers:
        - name: bot
          image: ghcr.io/YOUR_GITHUB_USERNAME/dota2-checker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: HEALTH_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dota2-checker-secrets
                  key: BOT_TOKEN
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dota2-checker
  namespace: dota2-checker
spec:
  selector:
    app: dota2-checker
  ports:
    - name: health
      port: 8080
      targetPort: health
